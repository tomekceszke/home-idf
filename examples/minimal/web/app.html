<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo</title></head>
<body>
<pre id="s"></pre><button id="l">Log out</button>
<script>
let csrf = '';
const api = (path, body) => fetch(path, body === undefined ? {cache: 'no-store'} : {method: 'POST', cache: 'no-store',
  headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf}, body: JSON.stringify(body)});
(async () => {
  csrf = (await (await api('/api/session')).json()).csrf;
  document.getElementById('s').textContent = JSON.stringify(await (await api('/api/hello')).json(), null, 2);
})();
document.getElementById('l').onclick = async () => { await api('/api/logout', {}); location.reload(); };
</script>
</body></html>
